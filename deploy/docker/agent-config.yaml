# Collector config for the docker-compose trial. The local VM is reached via the
# compose service name "victoriametrics", the local Loki via "loki", and the
# local Tempo via "tempo" (not 127.0.0.1).
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
  leansignal_edge_controller:
    endpoint: "${env:LEANSIGNAL_ENDPOINT}"   # gRPC target (host:port, no scheme)
    agent_key: "${env:LEANSIGNAL_AGENT_KEY}"
    insecure: false                           # TLS to <tenant>-grpc.<domain>:443; set true only against a local h2c lean-api
    reconnect_interval: 5s
    ping_interval: 30s
    local_vm_query_url: "http://victoriametrics:8428"  # UI edit-mode queries tunnel here
    local_loki_query_url: "http://loki:3100"           # UI edit-mode LOG queries tunnel here
    local_tempo_query_url: "http://tempo:3200"         # UI edit-mode TRACE queries tunnel here

  # Pause-on-limit valves for the tenant ingest exporters (wired via their
  # `auth` slots): a 403 from the ingest edge (ingest limit exceeded) pauses
  # that signal's pushes locally, one probe per retry_interval (default 1m).
  leansignal_ingest_backoff/metrics:
  leansignal_ingest_backoff/logs:
  leansignal_ingest_backoff/traces:

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
  # Loki push (promtail/alloy-style shippers), from this host and fleet nodes
  # forwarding to this gateway agent.
  loki:
    protocols:
      http:
        endpoint: 0.0.0.0:3500
      grpc:
        endpoint: 0.0.0.0:3600
processors:
  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]
    override: false
  resource:
    attributes:
      # insert (not upsert): preserve identity edge agents already stamped.
      - key: leansignal.agent.name
        value: "${env:LEANSIGNAL_AGENT_NAME}"
        action: insert
      - key: leansignal.mode
        value: central
        action: insert
  batch:
    send_batch_size: 5000
    timeout: 1s
  leansignalmetrics_tracker:
    log_metrics: false
    log_series: false
  leansignal_demand_filter:
    log_filtered: false
  leansignal_log_demand_filter:
    log_filtered: false
  leansignal_trace_demand_filter:
    log_filtered: false

exporters:
  # resource_to_telemetry_conversion promotes resource attributes
  # (leansignal.agent.name, host.name, os.type, leansignal.mode) to per-series
  # labels (leansignal_agent_name, host_name, os_type, leansignal_mode).
  prometheusremotewrite/local:
    endpoint: http://victoriametrics:8428/api/v1/write
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true
    # Synthesized post-demand-filter and redundant under
    # resource_to_telemetry_conversion — would land undemanded in the store.
    target_info:
      enabled: false
  prometheusremotewrite/dataplane:
    endpoint: "${env:LEANSIGNAL_DATAPLANE_ENDPOINT}"
    headers:
      Authorization: "Bearer ${env:LEANSIGNAL_AGENT_KEY}"
    auth:
      authenticator: leansignal_ingest_backoff/metrics
    resource_to_telemetry_conversion:
      enabled: true
    target_info:
      enabled: false
  # Local Loki (compose service) - receives every log stream.
  otlphttp/loki_local:
    logs_endpoint: http://loki:3100/otlp/v1/logs
    # Cap each outgoing request at ~2 MB of proto bytes: Loki/Tempo single
    # binaries reject anything over 4 MiB on their internal distributor->ingester
    # gRPC hop (dskit default grpc_server_max_recv_msg_size), and an oversized
    # request can never succeed by retrying - it wedges the queue until dropped.
    # bytes-sizer batching merges small requests and splits big ones to fit.
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 50000000
      batch:
        # explicit sizer: on v0.141 the batch does NOT reliably inherit the
        # queue's sizer (collector bug #14500, fixed in v0.145) - without this
        # max_size would silently mean 2M ITEMS, i.e. no byte cap at all.
        sizer: bytes
        flush_timeout: 1s
        max_size: 2000000
  # Tenant Loki - only the demanded streams; the agent key is the bearer token.
  otlphttp/loki_tenant:
    logs_endpoint: "${env:LEANSIGNAL_LOKI_ENDPOINT}/otlp/v1/logs"
    headers:
      Authorization: "Bearer ${env:LEANSIGNAL_AGENT_KEY}"
    auth:
      authenticator: leansignal_ingest_backoff/logs
    retry_on_failure:
      enabled: true
    # Cap each outgoing request at ~2 MB of proto bytes: Loki/Tempo single
    # binaries reject anything over 4 MiB on their internal distributor->ingester
    # gRPC hop (dskit default grpc_server_max_recv_msg_size), and an oversized
    # request can never succeed by retrying - it wedges the queue until dropped.
    # bytes-sizer batching merges small requests and splits big ones to fit.
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 50000000
      batch:
        # explicit sizer: on v0.141 the batch does NOT reliably inherit the
        # queue's sizer (collector bug #14500, fixed in v0.145) - without this
        # max_size would silently mean 2M ITEMS, i.e. no byte cap at all.
        sizer: bytes
        flush_timeout: 1s
        max_size: 2000000
  # Local Tempo (compose service) - receives every span (OTLP on the Tempo
  # container's own 4318).
  otlphttp/tempo_local:
    traces_endpoint: http://tempo:4318/v1/traces
    retry_on_failure:
      enabled: true
    # Cap each outgoing request at ~2 MB of proto bytes: Loki/Tempo single
    # binaries reject anything over 4 MiB on their internal distributor->ingester
    # gRPC hop (dskit default grpc_server_max_recv_msg_size), and an oversized
    # request can never succeed by retrying - it wedges the queue until dropped.
    # bytes-sizer batching merges small requests and splits big ones to fit.
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 50000000
      batch:
        # explicit sizer: on v0.141 the batch does NOT reliably inherit the
        # queue's sizer (collector bug #14500, fixed in v0.145) - without this
        # max_size would silently mean 2M ITEMS, i.e. no byte cap at all.
        sizer: bytes
        flush_timeout: 1s
        max_size: 2000000
  # Tenant Tempo - only the demanded resources' spans, one org per trace
  # ingestion rule (the router pushes to /v1/traces/r/<filter-id>); the agent
  # key is the bearer token.
  leansignal_trace_router:
    endpoint: "${env:LEANSIGNAL_TEMPO_ENDPOINT}"
    headers:
      Authorization: "Bearer ${env:LEANSIGNAL_AGENT_KEY}"
    timeout: 30s
    # Same queue/retry/byte-cap idiom as the otlphttp exporters above —
    # requires agent >= 0.8.7 (tracerouter gained sending_queue/retry).
    retry_on_failure:
      enabled: true
    sending_queue:
      enabled: true
      sizer: bytes
      queue_size: 50000000
      batch:
        sizer: bytes
        flush_timeout: 1s
        max_size: 2000000

connectors:
  forward/demand_filter: {}
  forward/log_demand_filter: {}
  forward/trace_demand_filter: {}

service:
  extensions: [health_check, leansignal_edge_controller, leansignal_ingest_backoff/metrics, leansignal_ingest_backoff/logs, leansignal_ingest_backoff/traces]
  pipelines:
    metrics/all:
      receivers: [otlp]
      processors: [resourcedetection, resource, leansignalmetrics_tracker, batch]
      exporters: [prometheusremotewrite/local, forward/demand_filter]
    metrics/filtered:
      receivers: [forward/demand_filter]
      processors: [leansignal_demand_filter, batch]
      exporters: [prometheusremotewrite/dataplane]
    logs/all:
      receivers: [otlp, loki]
      processors: [resourcedetection, resource, batch]
      exporters: [otlphttp/loki_local, forward/log_demand_filter]
    logs/filtered:
      receivers: [forward/log_demand_filter]
      processors: [leansignal_log_demand_filter, batch]
      exporters: [otlphttp/loki_tenant]
    traces/all:
      receivers: [otlp]
      processors: [resourcedetection, resource, batch]
      exporters: [otlphttp/tempo_local, forward/trace_demand_filter]
    traces/filtered:
      receivers: [forward/trace_demand_filter]
      processors: [leansignal_trace_demand_filter, batch]
      exporters: [leansignal_trace_router]
  telemetry:
    # SELF-MONITORING. The collector's OWN telemetry — metrics, logs AND traces —
    # is pushed via OTLP to the agent's own loopback OTLP receiver (127.0.0.1:4317).
    # It then flows through the same */all pipelines as everything else: written in
    # full to the local store (queryable via "Available") and forwarded to the
    # tenant only when demanded ("Stored"). The agent's own service.name is
    # "leansignal-agent".
    #
    # Logs ALSO keep going to stderr/journald (adding OTLP does not silence the
    # console). `metrics.level: detailed` adds the gRPC/HTTP latency histograms on
    # top of the normal otelcol_* counters. The collector emits very few internal
    # spans by design, so `traces` yields little volume today (wired for future use).
    metrics:
      level: detailed
      readers:
        - periodic:
            interval: 15000        # milliseconds (15s), matching the old scrape
            exporter:
              otlp:
                protocol: grpc
                endpoint: http://127.0.0.1:4317
    logs:
      level: info
      processors:
        - batch:
            exporter:
              otlp:
                protocol: grpc
                endpoint: http://127.0.0.1:4317
    traces:
      processors:
        - batch:
            exporter:
              otlp:
                protocol: grpc
                endpoint: http://127.0.0.1:4317
