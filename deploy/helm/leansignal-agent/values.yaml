# Default values for the leansignal-agent chart.

image:
  repository: ghcr.io/leansignal/leansignal-agent
  # Defaults to the chart appVersion if empty.
  tag: ""
  pullPolicy: IfNotPresent
pullSecrets: []

# -- Number of collector replicas. The edge-controller + tracker assume a single
# process per agent; keep this at 1 unless you understand the deduplication impact.
replicaCount: 1

# Control-plane connection to LeanSignal (the edge-controller extension).
leansignal:
  # Tenant slug. This is the ONE required host input: the ${leansignal:...} config
  # provider derives every backend host from it — <tenant>-grpc.<region>:443 and
  # the per-signal <tenant>-{metrics,logs,traces}-ingest.<region>. In the common
  # case this (plus the agent key) is all you set.
  tenant: ""
  # Region domain. Leave EMPTY to have the agent resolve the tenant's region from
  # control-center at startup (GET /resolve_tenant). Set it (e.g. eu11.leansignal.io)
  # to PIN the region and skip that lookup — recommended when you want no
  # control-center dependency at pod start.
  domain: ""
  # Advanced (resolve tuning): control-center origin + resolve token. Both have
  # sensible built-in defaults (https://cc.leansignal.io + the public token).
  ccUrl: ""
  resolveAat: ""
  # Human-friendly name for this agent; becomes the agent_name label on every
  # metric. Leave empty to default to the Kubernetes node name (spec.nodeName).
  agentName: ""
  # Deployment mode: "central" (default - full pipeline: local VM, tracker, demand
  # filter, dataplane, control channel) or "edge" (a lightweight OTLP forwarder to
  # a central agent). Setting centralAgentGrpcUrl implies edge.
  mode: central
  # EDGE only: OTLP/gRPC endpoint of the central agent (host:port, plaintext h2c),
  # e.g. central-agent.othernamespace.svc:4317. In edge mode disable the bundled VM
  # (victoria-metrics-single.enabled=false, the default) and --tenant is not needed.
  centralAgentGrpcUrl: ""
  # Advanced: pin the gRPC control host (host:port, no scheme), skipping
  # resolution for it — e.g. an in-cluster h2c host. Leave empty to derive.
  endpoint: ""
  # Disable TLS on the control channel (h2c) - only for in-cluster/testing.
  insecure: false
  agentKey:
    # Provide the key inline (stored in a generated Secret)...
    value: ""
    # ...or reference an existing Secret you manage.
    existingSecret: ""
    existingSecretKey: agent-key

# Collector config source. By default the chart renders the config into a
# ConfigMap from the values above (survives pod redeploys and image upgrades).
# Set existingConfigMap to the name of a ConfigMap you manage (with a config.yaml
# key) to own the config out-of-band: the chart then renders no ConfigMap and
# never overwrites yours, so hand edits persist across `helm upgrade`.
# Pod- and container-level security contexts for the collector.
#
# The defaults satisfy the **restricted** Pod Security Standard, so the chart
# installs unchanged in a namespace enforcing it. The agent image is distroless
# `:nonroot` and binds no privileged port, so it needs nothing beyond this.
# Set either to `{}` to render none.
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

config:
  existingConfigMap: ""

  # Make the collector config editable at runtime — from the LeanSignal app
  # (Agents -> the agent -> Configuration) or the agent_config_update MCP tool.
  #
  # A ConfigMap volume is mounted READ-ONLY by the kubelet and no flag changes
  # that, so editing means not mounting a ConfigMap at all. With this on, the
  # config lives in a small PVC instead, seeded ONCE from the ConfigMap by an
  # init container on first start.
  #
  # The trade-off is real and worth stating plainly: after that first boot the
  # PVC is the source of truth, so changes to the config through `helm upgrade`
  # NO LONGER REACH THE AGENT. To hand control back to the chart, delete
  # config.yaml from the volume (or the whole PVC) and restart the pod — it will
  # re-seed. Uninstalling the release deletes the PVC and any edits with it.
  #
  # Leave this false when the config is managed by GitOps (ArgoCD, Flux): there
  # the repo should stay the source of truth, an edit would be reverted by the
  # next sync anyway, and the agent honestly reports the file as non-writable so
  # the UI opens read-only with the reason.
  writable: false

  # Size of that PVC. It holds a couple of small YAML files; most provisioners
  # round up to their own minimum regardless.
  size: 16Mi

  # StorageClass for the PVC. Empty uses the cluster default.
  storageClass: ""

  # fsGroup applied to the pod when the config is writable, so the provisioned
  # volume is group-owned and group-writable by the agent (distroless :nonroot,
  # uid 65532). The seed init container also runs as this uid, so nothing in the
  # pod runs as root and the seeded config ends up owned by the agent. Only
  # change this if you also override the image with one running as another user.
  #
  # Note: a few storage backends (some NFS/CIFS and CSI drivers) do not apply
  # fsGroup. There the volume stays root-owned, the agent cannot write to it, and
  # it correctly reports the config as non-writable. Use a storage class that
  # honours fsGroup for this mode.
  fsGroup: 65532

  # Image for the one-shot init container that seeds the volume. The agent image
  # is distroless and has no shell, so it cannot do the copy itself. This is the
  # chart's only image outside ghcr.io — point it at your own registry for
  # mirrored or air-gapped installs (any image with /bin/sh and cp will do).
  seedImage: busybox:1.37.0

# Central, long-retention store that receives only demanded metrics
# (Prometheus remote-write URL).
dataplane:
  # Advanced: pin the metrics-ingest BASE URL (the exporter appends /api/v1/write),
  # skipping resolution for it. Leave empty to derive
  # https://<tenant>-metrics-ingest.<region>.
  endpoint: ""

# Scrape the co-located stores' own /metrics (avm vm_*, aloki loki_*, atempo
# tempo_*) into the metrics pipeline — agent-stack health (local disk, window
# pressure, ingest errors) becomes demandable like any other metric. Central
# mode only; jobs are named leansignal-avm / leansignal-aloki / leansignal-atempo.
localStores:
  scrape:
    enabled: true
    interval: 30s

# Local, full-fidelity VictoriaMetrics that receives everything.
localVM:
  # Prometheus remote-write endpoint of the local store. When the bundled
  # subchart is enabled, this default targets its service.
  writeEndpoint: ""
  # Query base URL (no /api/v1/write) of the local store. lean-api proxies the
  # UI's edit-mode queries down the control stream and the agent runs them here.
  # Leave empty to derive it from writeEndpoint / the bundled subchart.
  queryEndpoint: ""

# Logs pipelines (demand-driven logging; central mode only). The agent writes
# every log stream to a local Loki (short window) and forwards only the demanded
# streams to the tenant Loki.
logs:
  enabled: true
  # Advanced: pin the tenant logs-ingest BASE URL (the exporter appends
  # /otlp/v1/logs), skipping resolution for it. Leave empty to derive
  # https://<tenant>-logs-ingest.<region>.
  tenantEndpoint: ""

# Local, full-fidelity Loki ("aloki") that receives every log stream. By default
# the chart deploys it as its OWN Deployment + ClusterIP Service (the same
# topology as avm / the bundled VictoriaMetrics), so nothing else is needed.
localLoki:
  # Deploy the bundled aloki Deployment (ClusterIP, ~1h window). Turn off to
  # bring your own Loki (then set writeEndpoint/queryEndpoint) or to skip local
  # log storage entirely. Ignored unless logs.enabled and central mode. Setting
  # writeEndpoint also disables the bundled store (you're pointing at your own).
  deploy: true
  image:
    repository: grafana/loki
    tag: "3.5.12"
    pullPolicy: IfNotPresent
  service:
    port: 3100
  # Persistent storage for the local store. Off by default (emptyDir) — the
  # window is short and the data is a disposable local buffer. Enable for a PVC.
  persistence:
    enabled: false
    size: 5Gi
    storageClassName: ""
  resources:
    requests:
      cpu: "100m"
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # OTLP logs push endpoint of the local Loki (…/otlp/v1/logs). Empty → the
  # bundled aloki service (http://<release>-loki.<ns>.svc:3100/otlp/v1/logs).
  writeEndpoint: ""
  # Query base URL (no /otlp/v1/logs) of the local Loki. lean-api proxies the
  # UI's edit-mode LOG queries down the control stream and the agent runs them
  # here. Leave empty to derive it from writeEndpoint / the bundled service.
  queryEndpoint: ""

# Traces pipelines (demand-driven tracing; central mode only). The agent writes
# every span to a local Tempo (short window) and forwards only the demanded
# resources' spans to the tenant Tempo.
traces:
  enabled: true
  # Advanced: pin the tenant traces-ingest BASE URL (the exporter appends
  # /v1/traces), skipping resolution for it. Leave empty to derive
  # https://<tenant>-traces-ingest.<region>.
  tenantEndpoint: ""

# Local, full-fidelity Tempo ("atempo") that receives every span. By default the
# chart deploys it as its OWN Deployment + ClusterIP Service (the same topology
# as avm / the bundled VictoriaMetrics), so nothing else is needed.
localTempo:
  # Deploy the bundled atempo Deployment (ClusterIP, ~1h window). Turn off to
  # bring your own Tempo (then set writeEndpoint/queryEndpoint) or to skip local
  # trace storage entirely. Ignored unless traces.enabled and central mode.
  # Setting writeEndpoint also disables the bundled store.
  deploy: true
  image:
    repository: grafana/tempo
    tag: "2.7.1"
    pullPolicy: IfNotPresent
  service:
    # Query API port and OTLP-HTTP ingest port of the atempo service.
    queryPort: 3200
    otlpPort: 4318
  # Persistent storage for the local store. Off by default (emptyDir) — the
  # window is short and the data is a disposable local buffer. Enable for a PVC.
  persistence:
    enabled: false
    size: 5Gi
    storageClassName: ""
  resources:
    requests:
      cpu: "100m"
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # OTLP traces push endpoint of the local Tempo (…/v1/traces). Empty → the
  # bundled atempo service (http://<release>-tempo.<ns>.svc:4318/v1/traces).
  writeEndpoint: ""
  # Query base URL (no /v1/traces) of the local Tempo. lean-api proxies the
  # UI's edit-mode TRACE queries down the control stream and the agent runs
  # them here. Empty → the bundled atempo service (…-tempo.<ns>.svc:3200).
  queryEndpoint: ""

receivers:
  otlp:
    enabled: true
  k8sCluster:
    enabled: true
  kubeletStats:
    enabled: true
  # Loki push protocol (promtail/alloy-style shippers) for the logs/all pipeline.
  loki:
    enabled: true

# Bundled local VictoriaMetrics (upstream victoria-metrics-single chart) — the
# co-located metrics store, deployed by default so a plain install brings up all
# three local stores (VM + the Loki/Tempo sidecars above). Disable for edge mode
# or to point localVM.writeEndpoint at your own VM.
victoria-metrics-single:
  enabled: true
  server:
    retentionPeriod: 1d
    persistentVolume:
      enabled: true
      size: 20Gi
    # Same restricted-PSS baseline as the collector and the bundled Loki/Tempo,
    # so a namespace enforcing `restricted` admits the whole chart. The subchart
    # gates these on `enabled` and passes the rest through verbatim.
    podSecurityContext:
      enabled: true
      runAsNonRoot: true
      runAsUser: 1000
      runAsGroup: 1000
      fsGroup: 1000
      seccompProfile:
        type: RuntimeDefault
    securityContext:
      enabled: true
      allowPrivilegeEscalation: false
      capabilities:
        drop: [ALL]

resources:
  requests:
    cpu: "500m"
    memory: 512Mi
  limits:
    cpu: "2"
    memory: 2Gi

serviceAccount:
  create: true
  name: ""

rbac:
  # Create the ClusterRole/Binding needed by the k8s_cluster + kubeletstats receivers.
  create: true

service:
  # ClusterIP service exposing the OTLP receivers for in-cluster apps.
  type: ClusterIP
  otlpGRPCPort: 4317
  otlpHTTPPort: 4318
  # Loki push receiver ports (rendered only when logs + the loki receiver are enabled).
  lokiHTTPPort: 3500
  lokiGRPCPort: 3600

# OTLP ingress. DEFAULT OFF - exposing the agent's OTLP receivers over ingress is
# NOT a standard use case and, without care, can expose them unauthenticated on the
# public internet. Enable deliberately, and restrict to a private network (e.g.
# Tailscale) via annotations. gRPC and HTTP get SEPARATE ingresses (nginx
# backend-protocol is per-Ingress), each rendered only when its host is set.
ingress:
  enabled: false
  className: nginx
  # Applied to BOTH ingresses. For Tailscale-only access (nginx + source-range gate):
  #   nginx.ingress.kubernetes.io/whitelist-source-range: "100.64.0.0/10,10.42.0.0/24"
  annotations: {}
  # Declare tls.hosts so nginx serves TLS (its default wildcard cert unless
  # tlsSecretName is set).
  tls: true
  tlsSecretName: ""
  grpc:
    host: ""   # e.g. <name>-otlp-grpc.leansignal.io - required to render the gRPC ingress
  http:
    host: ""   # e.g. <name>-otlp-http.leansignal.io - required to render the HTTP ingress

podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}

# Extra collector log level: debug | info | warn | error
logLevel: info
