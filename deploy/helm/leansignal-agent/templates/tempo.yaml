{{- $mode := include "leansignal-agent.mode" . }}
{{- $traces := and .Values.traces.enabled (eq $mode "central") }}
{{- if and $traces .Values.localTempo.deploy (not .Values.localTempo.writeEndpoint) }}
{{- $name := printf "%s-tempo" (include "leansignal-agent.fullname" .) }}
# Co-located local Tempo ("atempo") — the traces twin of the bundled
# VictoriaMetrics. A normal single-replica Deployment + ClusterIP Service (the
# same topology as avm), reached in-cluster over service DNS. Single binary
# (monolithic), short (~1h) window; lean-api reads it over the agent's gRPC
# query tunnel. OTLP HTTP ingest on 4318, query API on 3200.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
  labels:
    {{- include "leansignal-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
data:
  tempo.yaml: |
    server:
      http_listen_address: 0.0.0.0
      http_listen_port: 3200
      grpc_listen_address: 0.0.0.0
      grpc_listen_port: 9097

    distributor:
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318

    storage:
      trace:
        backend: local
        # Bound concurrent block reads (compaction/query) so they can't balloon
        # memory past the container limit.
        pool:
          max_workers: 8
          queue_depth: 200
        local:
          path: /var/lib/tempo/blocks
        wal:
          path: /var/lib/tempo/wal
          # Force the classic v2 WAL, stored UNCOMPRESSED. The default vParquet
          # WAL compresses on disk, so ingester.max_block_bytes is measured on
          # the COMPRESSED size — a compressible span payload then packs GBs of
          # raw spans into a "small" block, `completing block` decodes all of it
          # and OOMs, and the poisoned WAL replays + re-OOMs on every restart (an
          # unrecoverable crash-loop). v2 + v2_encoding:none stores the WAL
          # uncompressed, so max_block_bytes bounds the true (decoded) size.
          version: v2
          v2_encoding: none
        block:
          version: vParquet4
          # The parquet row-group buffer is held decoded while a block is
          # written; the 100MB default balloons on repetitive attributes. 4MB
          # bounds it.
          parquet_row_group_size_bytes: 4194304

    # Block COMPLETION (WAL -> parquet) is the memory driver: keep blocks small
    # and short so the completion + compaction working set stays well under the
    # limit even on a maximally-compressible payload.
    ingester:
      max_block_bytes: 26214400        # 25MB per block
      max_block_duration: 1m           # cut often
      complete_block_timeout: 1m       # drop completed blocks from RAM quickly
      flush_check_period: 10s
      trace_idle_period: 10s

    # The "~1h window" is APPROXIMATE by design: Tempo has no query-lookback
    # bound (unlike the local Loki's max_query_lookback), deletion is
    # compaction-driven and block-granular, and recent spans live in the
    # ingester before blocks cut. block_retention bounds disk usage.
    compactor:
      compaction:
        block_retention: 1h
        # Bound the compaction working set: small output blocks + a short merge
        # window so a k-way merge never opens too many blocks at once.
        max_block_bytes: 52428800      # 50MB output
        compaction_window: 1m
        max_compaction_objects: 10000

    usage_report:
      reporting_enabled: false
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "leansignal-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
spec:
  type: ClusterIP
  selector:
    {{- include "leansignal-agent.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
  ports:
    - name: http
      port: {{ .Values.localTempo.service.queryPort }}
      targetPort: http
      protocol: TCP
    - name: otlp-http
      port: {{ .Values.localTempo.service.otlpPort }}
      targetPort: otlp-http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  labels:
    {{- include "leansignal-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
spec:
  replicas: 1
  # RWO volume: never run two pods on the same store at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "leansignal-agent.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: tempo
  template:
    metadata:
      annotations:
        checksum/config: {{ toYaml .Values.localTempo | sha256sum }}
      labels:
        {{- include "leansignal-agent.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: tempo
    spec:
      # Satisfies the restricted Pod Security Standard, so the chart installs
      # unchanged in a namespace enforcing it (see the collector's own
      # podSecurityContext/securityContext values).
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: tempo
          image: "{{ .Values.localTempo.image.repository }}:{{ .Values.localTempo.image.tag }}"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          imagePullPolicy: {{ .Values.localTempo.image.pullPolicy }}
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          env:
            # Soft heap target: turns a would-be OOM into GC backpressure so
            # transient completion/compaction spikes get collected before the
            # cgroup kills the pod. 650MiB keeps the container lean; the 2Gi
            # limit is a generous burst ceiling (same tuning as the tenant Tempo).
            - name: GOMEMLIMIT
              value: {{ .Values.localTempo.gomemlimit | default "650MiB" | quote }}
          ports:
            - { name: http, containerPort: 3200 }
            - { name: otlp-http, containerPort: 4318 }
          readinessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ready, port: http }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            {{- toYaml .Values.localTempo.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/tempo
              readOnly: true
            - name: data
              mountPath: /var/lib/tempo
      volumes:
        - name: config
          configMap:
            name: {{ $name }}
        - name: data
        {{- if .Values.localTempo.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ $name }}
        {{- else }}
          emptyDir: {}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- if .Values.localTempo.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $name }}
  labels:
    {{- include "leansignal-agent.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo
spec:
  accessModes: ["ReadWriteOnce"]
  {{- with .Values.localTempo.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.localTempo.persistence.size }}
{{- end }}
{{- end }}
