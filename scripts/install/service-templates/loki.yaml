# Loki config for the LeanSignal Agent's co-located local log store.
# Installed by scripts/install/install.sh to the platform's config dir
# (/etc/leansignal-agent/loki.yaml on Linux,
# /usr/local/etc/leansignal-agent/loki.yaml on macOS).
#
# The data-directory placeholder below is substituted by the installer with the
# platform data dir: /var/lib/leansignal-agent on Linux,
# /usr/local/var/leansignal-agent on macOS.
#
# Single binary, filesystem storage, loopback-only — the logs twin of the
# co-located VictoriaMetrics. It holds a short (~1h) full-fidelity window; the
# only way in from outside is the agent's gRPC query tunnel. Native OTLP
# ingestion (/otlp/v1/logs) needs no extra configuration.

auth_enabled: false

server:
  http_listen_address: 127.0.0.1
  http_listen_port: 3100
  grpc_listen_address: 127.0.0.1
  grpc_listen_port: 9096
  # The distributor hands pushes to the ingester over this loopback gRPC even
  # in single-binary mode, and the dskit default (4 MiB) silently bounces any
  # bigger push — counted as received, never stored. The agent caps its own
  # batches at 2 MB; 16 MiB here keeps 8x headroom for other OTLP writers.
  grpc_server_max_recv_msg_size: 16777216
  grpc_server_max_send_msg_size: 16777216

common:
  instance_addr: 127.0.0.1
  path_prefix: __DATA_DIR__/loki
  storage:
    filesystem:
      chunks_directory: __DATA_DIR__/loki/chunks
      rules_directory: __DATA_DIR__/loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# The "1h window", enforced in two layers:
#   - max_query_lookback makes the LOGICAL window exact: queries cannot see
#     past it, and ingest rejects backfill beyond it.
#   - retention_period (~2x the window) merely bounds disk usage; Loki deletion
#     is compactor-driven and chunk-granular, so it cannot cut exactly at 1h.
limits_config:
  max_query_lookback: 1h
  reject_old_samples: true
  reject_old_samples_max_age: 1h
  retention_period: 2h
  # This store mirrors EVERYTHING the host emits (full fidelity), so Loki's
  # defaults — 4 MB/s per tenant, 3 MB/s per stream — throttle a busy host and
  # the agent then buffers/retries against its own local store. Size for the
  # firehose, not for a shared multi-tenant Loki.
  ingestion_rate_mb: 32
  ingestion_burst_size_mb: 64
  per_stream_rate_limit: 16MB
  per_stream_rate_limit_burst: 32MB

compactor:
  working_directory: __DATA_DIR__/loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
  retention_delete_delay: 10m

analytics:
  reporting_enabled: false
